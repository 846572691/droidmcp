name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify CLI loads and enumerates tools
        run: |
          python -m droidmcp --version
          python -m droidmcp --list-tools

      - name: Smoke-test the MCP stdio handshake
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | python -m droidmcp > out.jsonl
          python - <<'PY'
          import json, pathlib
          lines = [json.loads(l) for l in pathlib.Path("out.jsonl").read_text().splitlines() if l.strip()]
          assert lines[0]["result"]["serverInfo"]["name"] == "droidmcp", lines[0]
          tools = {t["name"] for t in lines[1]["result"]["tools"]}
          assert {"tap_text", "screen_dump", "screenshot"} <= tools, tools
          print(f"handshake ok, {len(tools)} tools advertised")
          PY
